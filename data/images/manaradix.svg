<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <g fill="none" stroke="#000" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rettangolo nodo superiore -->
    <rect x="196" y="96" width="120" height="60" fill="none" />
    <!-- Rettangoli nodi inferiori -->
    <rect x="112" y="200" width="120" height="60" fill="none" />
    <rect x="280" y="200" width="120" height="60" fill="none" />

    <!-- Connessioni tra nodo superiore e inferiori -->
    <line x1="196" y1="156" x2="172" y2="200" />
    <line x1="316" y1="156" x2="348" y2="200" />

    <!-- Rami verso i tre cerchi -->
    <line x1="172" y1="260" x2="148" y2="320" />
    <line x1="256" y1="260" x2="256" y2="320" />
    <line x1="348" y1="260" x2="364" y2="320" />

    <!-- Cerchi terminali -->
    <circle cx="148" cy="340" r="12" fill="#000" />
    <circle cx="256" cy="340" r="12" fill="#000" />
    <circle cx="364" cy="340" r="12" fill="#000" />
  </g>

  <!-- Testo manaradix -->
  <text x="256" y="430" text-anchor="middle" font-family="sans-serif" font-size="56" fill="#000">
    manaradix
  </text>
</svg>

