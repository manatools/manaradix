<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Bus policy for the manaradix system service.

  Anyone may call the service; each method is authorized individually
  against the org.mageia.manaradix.* polkit actions by the daemon
  itself (see manaradix/dbus/constants.py METHOD_ACTIONS).
-->
<busconfig>
  <policy user="root">
    <allow own="org.mageia.manaradix"/>
    <allow send_destination="org.mageia.manaradix"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.mageia.manaradix" send_interface="org.mageia.manaradix"/>
    <allow send_destination="org.mageia.manaradix" send_interface="org.freedesktop.DBus.Peer"/>
    <allow send_destination="org.mageia.manaradix" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.mageia.manaradix" send_interface="org.freedesktop.DBus.Properties"/>
  </policy>
</busconfig>
