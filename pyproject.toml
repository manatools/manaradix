[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manaradix"
version = "0.1.3"
description = "Btrfs snapshot, subvolume, and filesystem management utility for Mageia"
readme = "README.md"
license = {text = "GPLv2+"}
requires-python = ">=3.11"
authors = [
    {name = "Mageia Community"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: System :: Systems Administration",
]

# python-manatools (in Mageia 10 official repositories) provides the UI
# layer; its aui backend is part of the released version.  It is a system
# package on Mageia, so it is declared in the RPM spec, not here.
# btrfs-progs, systemd, polkit, and grub2 are system-level dependencies.
dependencies = [
    "tomlkit>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "interrogate>=1.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
manaradix = "manaradix.module:main"

[tool.setuptools.packages.find]
include = ["manaradix*"]

[tool.interrogate]
fail_under = 90
exclude = ["tests/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--strict-markers"]

[tool.coverage.run]
source = ["manaradix"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
